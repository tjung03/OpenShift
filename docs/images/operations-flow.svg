<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">OpenShift 운영 점검 흐름</title>
  <desc id="desc">접속 대상과 권한 확인에서 시작해 ClusterOperator와 Node, Pod와 Event 및 Metrics, Debug와 Node Log, CRI-O 심화 진단으로 범위를 좁히는 순서</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 24px system-ui, sans-serif; }
      .step { fill: #dbeafe; font: 700 17px system-ui, sans-serif; }
      .detail { fill: #cbd5e1; font: 14px system-ui, sans-serif; }
      .box { fill: #1e293b; stroke: #60a5fa; stroke-width: 2; }
      .escalation { fill: #312e81; stroke: #a5b4fc; stroke-width: 2; }
      .arrow { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
  <text x="48" y="48" class="title">OpenShift troubleshooting path</text>
  <text x="48" y="73" class="detail">Read-only inspection first · privileged diagnostics only when needed</text>

  <rect x="45" y="110" width="190" height="112" rx="14" class="box"/>
  <text x="140" y="146" text-anchor="middle" class="step">1. Context &amp; RBAC</text>
  <text x="140" y="176" text-anchor="middle" class="detail">whoami · context</text>
  <text x="140" y="198" text-anchor="middle" class="detail">target project</text>

  <path d="M235 166 H270" class="arrow"/>

  <rect x="275" y="110" width="200" height="112" rx="14" class="box"/>
  <text x="375" y="146" text-anchor="middle" class="step">2. Cluster health</text>
  <text x="375" y="176" text-anchor="middle" class="detail">ClusterOperator</text>
  <text x="375" y="198" text-anchor="middle" class="detail">Node conditions</text>

  <path d="M475 166 H510" class="arrow"/>

  <rect x="515" y="110" width="200" height="112" rx="14" class="box"/>
  <text x="615" y="146" text-anchor="middle" class="step">3. Workload</text>
  <text x="615" y="176" text-anchor="middle" class="detail">Pod · Event · Log</text>
  <text x="615" y="198" text-anchor="middle" class="detail">Metrics</text>

  <path d="M715 166 H750" class="arrow"/>

  <rect x="755" y="110" width="190" height="112" rx="14" class="box"/>
  <text x="850" y="146" text-anchor="middle" class="step">4. Debug</text>
  <text x="850" y="176" text-anchor="middle" class="detail">oc debug</text>
  <text x="850" y="198" text-anchor="middle" class="detail">node logs</text>

  <path d="M945 166 H980" class="arrow"/>

  <rect x="985" y="110" width="170" height="112" rx="14" class="escalation"/>
  <text x="1070" y="146" text-anchor="middle" class="step">5. Runtime</text>
  <text x="1070" y="176" text-anchor="middle" class="detail">CRI-O · PID</text>
  <text x="1070" y="198" text-anchor="middle" class="detail">lsns · nsenter</text>

  <text x="1070" y="251" text-anchor="middle" class="detail">Privileged escalation</text>
</svg>
